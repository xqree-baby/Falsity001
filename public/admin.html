<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核入口</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app">
    <div class="row">
      <h1>项目 · 经验分享</h1>
      <nav>
        <a href="/">← 返回首页</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>审核入口</h2>
    <p class="muted">未认证用户提交的「提问」帖会先到这里。通过 → 上首页；拒绝 → 删除。</p>
    <div id="list" class="toolbar-wrap"></div>
  </main>

  <script>
    async function load() {
      const root = document.getElementById('list');
      root.innerHTML = '<p class="muted">加载中…</p>';
      try {
        const r = await fetch('/api/admin/pending');
        const data = await r.json();
        if (!data.posts.length) {
          root.innerHTML = '<p class="muted">暂无待审核帖子。</p>';
          return;
        }
        root.innerHTML = '';
        for (const p of data.posts) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${escapeHtml(p.title)}</h3>
            <div class="meta">
              <span class="badge pending">待审核</span>
              <span class="badge question">提问</span>
              <span class="muted">${escapeHtml(p.author)} · ${formatDate(p.createdAt)}</span>
            </div>
            <div class="post-body">${escapeHtml(p.body)}</div>
            <div class="toolbar">
              <button data-id="${p.id}" data-action="approve">通过</button>
              <button data-id="${p.id}" data-action="reject" class="danger">拒绝</button>
            </div>
          `;
          root.appendChild(card);
        }
        root.querySelectorAll('button[data-action]').forEach(btn => {
          btn.addEventListener('click', () => onAction(btn.dataset.id, btn.dataset.action));
        });
      } catch (e) {
        // Day 23：英文异常换成中文人话
        root.innerHTML = '<p class="notice error">' + escapeHtml(friendlyText(e, '列表加载失败，请稍后重试')) + '</p>';
      }
    }

    async function onAction(id, action) {
      const label = action === 'approve' ? '通过' : '拒绝';
      if (!confirm('确认要「' + label + '」这个帖子吗？' + (action === 'reject' ? '（会被删除）' : ''))) return;
      try {
        const r = await fetch('/api/admin/posts/' + encodeURIComponent(id) + '/' + action, {
          method: 'POST',
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert('操作失败：' + (err.error || '服务器返回 ' + r.status + '，请稍后重试'));
          return;
        }
        await load();
      } catch (e) {
        alert('操作失败：' + friendlyText(e, '请稍后重试'));
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // Day 23：把裸报错翻成人话（与 index.html 同一份逻辑，四个页面各存一份是因为没有构建步骤）
    // 改前：页面直接显示 'TypeError: Failed to fetch' 这类英文
    function friendlyError(e, fallback) {
      const raw = (e && (e.message || e.toString())) || String(e || '');
      if (/Failed to fetch|NetworkError|Load failed/i.test(raw)) {
        return { text: '连不上服务器，请检查网络后重试', detail: raw };
      }
      if (/timeout|abort/i.test(raw)) {
        return { text: '服务器响应太慢了，请稍后重试', detail: raw };
      }
      if (/Unexpected token|is not valid JSON|JSON parse/i.test(raw)) {
        return { text: '服务器返回的数据格式不对，请稍后重试', detail: raw };
      }
      return { text: fallback || '出了点问题，请稍后重试', detail: raw };
    }
    function friendlyText(e, fallback) {
      return friendlyError(e, fallback).text;
    }
    function formatDate(iso) {
      try {
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } catch (e) { return iso; }
    }

    load();
  </script>
</body>
</html>
